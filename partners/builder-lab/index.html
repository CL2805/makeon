const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(code){
 const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
 const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();
}
const KEY='mk_lab_code';
let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
if(saved)open(saved).catch(()=>{try{localStorage.removeItem(KEY)}catch(e){}});
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const c=document.getElementById('c').value.trim();const e=document.getElementById('e');const rem=document.getElementById('r').checked;e.textContent='Opening…';
 try{await open(c);if(rem){try{localStorage.setItem(KEY,c)}catch(x){}}}catch(x){e.textContent='That passcode did not work.'}});
}
</script></body></html>
