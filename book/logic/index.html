:root {
  --desk: #0f1b3d;        /* Board navy */
  --desk-deep: #0a1330;
  --rail: #16234a;
  --line: #2a3866;
  --chalk: #f4f0e6;
  --muted: #a6aec8;
  --signal: #e8530a;      /* actions */
  --level: #6fa82e;    /* this book's Level colour */
  --page: #ffffff;
  --display: "MAKEON Trace", "Barlow", system-ui, sans-serif;
  --body: "Barlow", "Noto Sans Tamil", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--desk); color: var(--chalk); font-family: var(--body); margin: 0; overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }
header, footer { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); background: var(--desk-deep); min-height: 36px; }
.mark { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; }
.mark b { font-family: var(--display); font-size: 22px; letter-spacing: .02em; color: var(--chalk); }
.mark b i { font-style: normal; display: inline-block; width: 9px; height: 9px; background: var(--level); margin-left: 6px; vertical-align: 2px; }
.mark span { font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.go { display: flex; gap: 8px; }
.btn { font: 600 14px/1 var(--body); color: var(--chalk); background: transparent; border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--signal); border-color: var(--signal); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:focus-visible, .hot:focus-visible, input:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
#box { width: 300px; max-width: 100%; }
.page { background: var(--page); overflow: hidden; }
.page img { width: 100%; height: 100%; display: block; object-fit: cover; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.hot { position: absolute; display: block; border-radius: 3px; box-shadow: inset 0 0 0 1.5px rgba(232, 83, 10, 0); transition: box-shadow .2s, background .2s; z-index: 3; }
.hot:hover, .pulse .hot { box-shadow: inset 0 0 0 2px var(--signal); background: rgba(232, 83, 10, .10); }
footer { display: flex; flex-direction: column; gap: 8px; padding-block: 8px 12px; border-top: 1px solid var(--line); background: var(--desk-deep); }
.row { display: flex; align-items: center; gap: 10px; }
.turn { width: 44px; height: 40px; padding: 0; justify-content: center; font-size: 20px; }
#where { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--chalk); min-width: 9.5em; text-align: center; }
#seek { flex: 1; min-width: 0; accent-color: var(--level); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 30px; align-items: center; }
.chips .lead { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.chip { font: 600 13px/1 var(--body); color: var(--chalk); text-decoration: none; padding: 7px 10px; border-radius: 99px; background: var(--rail); border: 1px solid var(--line); }
.chip:hover { border-color: var(--signal); }
.chip::after { content: " ↗"; color: var(--signal); }
.hint { font-size: 12px; color: var(--muted); margin-left: auto; }
#loading { font-size: 14px; color: var(--muted); }
@media (max-width: 640px) {
  .mark span { display: none; }
  .btn .long { display: none; }
  #where { min-width: 7em; font-size: 13px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .hot { transition: none; } }
</style>

const T = {"page": "Page", "pages": "Pages", "arc": "Ask ARC", "sketch": "sketch", "onpage": "On these pages", "soundon": "Sound on", "soundoff": "Sound off", "hint": "Drag a page corner, tap a page edge, or use ‹ › and the arrow keys.", "noload": "The page-turn engine did not load. Check the connection and reload.", "names": {"Front cover": "Front cover", "Inside front cover": "Inside front cover", "Inside back cover": "Inside back cover", "Back cover": "Back cover"}};
const N = BOOK.pages.length, RATIO = BOOK.w / BOOK.h;

/* ---------- pages ---------- */
BOOK.pages.forEach((p, i) => {
  const d = document.createElement('div');
  d.className = 'page';
  if (i === 0 || i === N - 1) d.dataset.density = 'hard';
  const img = document.createElement('img');
  img.alt = p.label; img.dataset.src = 'pages/' + String(i).padStart(3, '0') + '.webp'; img.decoding = 'async';
  d.appendChild(img);
  p.links.forEach(L => {
    const a = document.createElement('a');
    a.className = 'hot'; a.href = L.href; a.target = '_blank'; a.rel = 'noopener';
    a.setAttribute('aria-label', label(L.href));
    a.title = label(L.href);

  });

function label(href) {
  const u = href.replace(/^https?:\/\//, '').replace(/\/$/, '');
  if (u === 'bench.makeon.build') return 'Builder’s Bench';
  if (u.endsWith('/arc')) return T.arc;
  const m = u.match(/\/s\/([A-Z]+_\w+)$/); if (m) return m[1] + ' ' + T.sketch;
  return u;
}
const imgs = [...book.querySelectorAll('img')];
function warm(i) { for (let k = i - 3; k <= i + 6; k++) { const im = imgs[k]; if (im && !im.src) im.src = im.dataset.src; } }

/* ---------- sizing: the book fills the stage at the page's own ratio ---------- */
function fit() {
  const st = document.getElementById('stage'), cs = getComputedStyle(st);
  const aw = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = st.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const spread = aw >= 640 && aw / ah > RATIO * 1.25;
  const w = Math.floor(Math.min(aw, ah * RATIO * (spread ? 2 : 1)));
  box.style.width = w + 'px';
  if (pf) pf.getSettings().minWidth = spread ? 1 : 1e6;   // tells the flip engine: two pages or one
  return spread;
}
window.addEventListener('resize', fit);
let pf;
const SPREAD = fit();

/* ---------- the flip ---------- */
const start = Math.max(0, Math.min(N - 1, parseInt((location.hash.match(/^#page-(\d+)$/) || [])[1] || '0', 10)));

function boot() {
  document.getElementById('loading').hidden = true;

    width: BOOK.w, height: BOOK.h, size: 'stretch',
    minWidth: 1, maxWidth: 4000, minHeight: 1, maxHeight: 4000 / RATIO,

  show(start);
  setTimeout(() => { book.classList.add('pulse'); setTimeout(() => book.classList.remove('pulse'), 1400); }, 600);
}

const where = document.getElementById('where'), seek = document.getElementById('seek'), chips = document.getElementById('chips');

function name(i) { const l = BOOK.pages[i].label; return /^\d+$/.test(l) ? T.page + ' ' + l : T.names[l] || l; }
function visible(i) {
  if (!pf || pf.getOrientation() === 'portrait' || i === 0 || i === N - 1) return [i];
  const L = i % 2 === 1 ? i : i - 1; return [L, L + 1].filter(k => k < N - 1);
}
function show(i) {
  const v = visible(i);
  const l0 = BOOK.pages[v[0]].label, l1 = v[1] != null ? BOOK.pages[v[1]].label : null;
  where.textContent = (l1 && /^\d+$/.test(l0) && /^\d+$/.test(l1)) ? T.pages + ' ' + l0 + '–' + l1
    : v.map(name).join(' · ');
  seek.value = i;
  try { history.replaceState(null, '', '#page-' + i); } catch (e) {}
  const seen = new Set(); chips.innerHTML = '';
  v.forEach(k => BOOK.pages[k].links.forEach(L => {
    const lb = label(L.href); if (seen.has(lb)) return; seen.add(lb);
    const a = document.createElement('a'); a.className = 'chip'; a.href = L.href; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = label(L.href); chips.appendChild(a);
  }));

  if (!pf || e.target === seek) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { pf.flipNext(); e.preventDefault(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { pf.flipPrev(); e.preventDefault(); }
  if (e.key === 'Home') { pf.turnToPage(0); show(0); }
  if (e.key === 'End') { pf.turnToPage(N - 1); show(N - 1); }

/* ---------- the turn sound: a paper snap and a short swish, made here, no file ---------- */
let ac = null, on = true;

function sound() {
  if (!on || !ac || ac.state !== 'running') return;
  const now = ac.currentTime; if (now - last < 0.25) return; last = now;
  const sr = ac.sampleRate;
  // swish: band-passed noise that falls in pitch as the page sweeps over
  const len = Math.floor(sr * 0.42), buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) { const t = i / len; d[i] = (Math.random() * 2 - 1) * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.6)), 1.4) * (1 - t); }
  const n = ac.createBufferSource(); n.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
  bp.frequency.setValueAtTime(3200, now); bp.frequency.exponentialRampToValueAtTime(700, now + 0.4);
  const g = ac.createGain(); g.gain.value = 0.22;
  n.connect(bp).connect(g).connect(ac.destination); n.start(now);
  // click: the page landing, a few milliseconds of bright noise
  const cl = Math.floor(sr * 0.018), cb = ac.createBuffer(1, cl, sr), c = cb.getChannelData(0);
  for (let i = 0; i < cl; i++) c[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sr * 0.0025));
  const k = ac.createBufferSource(); k.buffer = cb;
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
  const kg = ac.createGain(); kg.gain.value = 0.55;
  k.connect(hp).connect(kg).connect(ac.destination); k.start(now + 0.62);
}
const snd = document.getElementById('snd'), sndl = document.getElementById('sndl');
function paintSnd() { snd.setAttribute('aria-pressed', on); sndl.textContent = on ? T.soundon : T.soundoff; snd.style.opacity = on ? 1 : .6; }
snd.onclick = () => { on = !on; try { localStorage.setItem('flip-sound', on ? 'on' : 'off'); } catch (e) {} paintSnd(); if (on) { wake(); setTimeout(sound, 30); } };
paintSnd();

/* ---------- full screen (where the browser allows it) ---------- */

  const el = document.documentElement;
  try { if (!document.fullscreenElement) el.requestFullscreen().catch(() => {}); else document.exitFullscreen(); } catch (e) {}
